[program:bts-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /root/apps/bts-guru-daemon/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/root/apps/bts-guru-daemon/worker.log
stopwaitsecs=3600
